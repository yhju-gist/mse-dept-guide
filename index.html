<style>
:root{--c:#5B3FD6;--fg:#1F2624;--mid:#6B7470;--bg:#fff;--card:#F7F8F7;--line:#E2E5E3}
@media (prefers-color-scheme:dark){:root{--fg:#E9ECEA;--mid:#9AA19E;--bg:#141817;--card:#1C2120;--line:#2E3532}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
.w{max-width:880px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--c)}
.lg{background:#fff;border-radius:8px;padding:3px 6px;display:inline-flex}.lg img{height:40px}
.ch{height:64px;margin-left:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
h1{font-size:clamp(28px,6vw,40px);margin:28px 0 6px;font-weight:900}p.l{color:var(--mid);margin:0 0 24px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
a.c{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;border-top:5px solid var(--c);transition:transform .15s}
a.c:hover{transform:translateY(-3px)}a.c .i{font-size:34px}a.c b{display:block;font-size:20px;margin:8px 0 4px}a.c span{color:var(--mid);font-size:14.5px}
.f{margin-top:30px;color:var(--mid);font-size:12.5px}
